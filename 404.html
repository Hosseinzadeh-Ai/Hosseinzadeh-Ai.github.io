<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- لایه اول: CSP (دیوار آتشین مرورگر - نسخه پیشرفته و سخت‌گیرانه) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.clarity.ms; connect-src 'self' https://w.clarity.ms https://*.clarity.ms https://formspree.io; img-src 'self' data: https://c.clarity.ms;">
    <!-- لایه دوم: X-Frame-Options (ضد دزدی کلیک / Clickjacking) -->
    <!-- جلوگیری از نمایش سایت شما در داخل یک فریم (iframe) در سایت‌های کلاهبرداری -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <!-- لایه سوم: X-Content-Type-Options (ضد دستکاری نوع فایل / MIME Sniffing) -->
    <!-- جلوگیری از اجرای فایل‌های مخرب جاوااسکریپت که خود را به جای عکس جا زده‌اند -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- لایه چهارم: Referrer-Policy (حریم خصوصی کاربران شما) -->
    <!-- وقتی کاربر از سایت شما به لینکدین یا گیت‌هاب می‌رود، اطلاعات اضافی ارسال نشود -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>صفحه پیدا نشد | ۴۰۴</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #0f172a; text-align: center;">

    <div class="error-container" style="padding: 40px;">
        <!-- یک آیکون ربات خراب یا علامت سوال -->
        <i class="fas fa-robot" style="font-size: 6rem; color: #334155; margin-bottom: 20px;"></i>
        
        <h1 style="font-size: 4rem; color: #00d4ff; margin-bottom: 10px; text-shadow: 0 0 20px rgba(0,212,255,0.3);">404</h1>
        
        <h2 style="color: #fff; margin-bottom: 20px; font-size: 1.5rem;">اوه! هوش مصنوعی ما نتوانست این صفحه را پیدا کند.</h2>
        
        <p style="color: #94a3b8; margin-bottom: 40px; font-size: 1.1rem;">
            به نظر می‌رسد در فضای دیجیتال گم شده‌اید. نگران نباشید، بیایید به پایگاه اصلی برگردیم.
        </p>
        
        <a href="index.html" class="btn btn-primary" style="padding: 15px 40px; font-size: 1.1rem;">
            <i class="fas fa-home" style="margin-left: 10px;"></i> بازگشت به صفحه اصلی
        </a>
    </div>

</body>
</html>
